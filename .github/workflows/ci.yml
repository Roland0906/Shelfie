name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run it replaces
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Same major version as the JDK bundled with Android Studio
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Configuration also enforces the module dependency rules, so a violation fails here
      - name: Build and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The fat JAR is what the Docker image will copy in (see ADR 0008)
      - name: Test and package the server
        run: ./gradlew :server:test :server:buildFatJar

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-reports
          path: server/build/reports/tests/
